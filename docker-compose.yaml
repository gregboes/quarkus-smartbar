version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: smartbarbo-db
    environment:
      POSTGRES_USER: greg
      POSTGRES_PASSWORD: greg
      POSTGRES_DB: smartbarbo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: smartbarbo-adminer
    ports:
      - "5003:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
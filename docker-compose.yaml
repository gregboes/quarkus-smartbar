version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: smartbarbo-db
    restart: always
    environment:
      POSTGRES_USER: greg
      POSTGRES_PASSWORD: greg
      POSTGRES_DB: smartbarbo
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    container_name: smartbarbo-adminer
    restart: always
    ports:
      - "5003:8080"
    depends_on:
      - postgres
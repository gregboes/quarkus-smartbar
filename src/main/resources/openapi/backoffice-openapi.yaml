openapi: 3.0.3

info:
  title: Smartbar Backoffice API
  description: Smartbar Backoffice API
  version: 1.0.0

paths:
  /categories:
    get:
      tags:
        - Categories
      summary: Get all categories
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiCategory"

    post:
      tags:
        - Categories
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiCategory"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/id"

    get:
      tags:
        - Categories
      summary: Get a category by id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiCategory"

    put:
      tags:
        - Categories
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiCategory"
      responses:
        "200":
          description: Entity successfully updated

    delete:
      tags:
        - Categories
      summary: Delete a category
      responses:
        "200":
          description: Entity successfully deleted

  /articles:
    get:
      tags:
        - Articles
      summary: Get all articles
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiArticle"

    post:
      tags:
        - Articles
      summary: Create an article
      parameters:
        - name: x-category-id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiArticle"
      responses:
        "201":
          $ref: "#/components/responses/ApiCreated"

  /articles/{articleId}:
    parameters:
      - name: articleId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/id"

    get:
      tags:
        - Articles
      summary: Get an article by id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiArticle"

    put:
      tags:
        - Articles
      summary: Update an article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiArticle"
      responses:
        "200":
          description: Entity successfully updated

    delete:
      tags:
        - Articles
      summary: Delete an article
      responses:
        "200":
          description: Entity successfully deleted

  /tables:
    get:
      tags:
        - Tables
      summary: Get all tables
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiTable"

    post:
      tags:
        - Tables
      summary: Create a table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTable"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /tables/{tableId}:
    parameters:
      - name: tableId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/id"

    get:
      tags:
        - Tables
      summary: Get a table by id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTable"

    put:
      tags:
        - Tables
      summary: Update a table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTable"
      responses:
        "200":
          description: Entity successfully updated

    delete:
      tags:
        - Tables
      summary: Delete a table
      responses:
        "200":
          description: Entity successfully deleted

components:
  schemas:
    id:
      type: integer
      format: int64
    ApiCategory:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string

    ApiArticle:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
        description:
          type: string
        picture:
          type: string

    ApiTable:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        seatCount:
          type: integer
        active:
          type: boolean

  responses:
    Created:
      description: Entity successfully created
      headers:
        Location:
          description: URL of the created resource
          schema:
            type: string